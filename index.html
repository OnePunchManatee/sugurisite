<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Audio Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.8;
        }
        
        .sentence {
            display: inline;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: background-color 0.2s;
        }
        
        .sentence:hover {
            background-color: #e8f4f8;
        }
        
        .sentence.playing {
            background-color: #b3e5fc;
            font-weight: bold;
        }
        
        p {
            margin: 15px 0;
        }
        
        .info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Click any sentence to hear it</h1>
    <p class="info">💡 Hover over sentences to see they're clickable</p>
    
    <p>
        <span class="sentence" data-audio="sentence1.mp3">Hello, how are you today?</span>
        <span class="sentence" data-audio="sentence2.mp3">I hope you're having a great day.</span>
    </p>
    
    <p>
        <span class="sentence" data-audio="sentence3.mp3">This is a simple interactive document.</span>
        <span class="sentence" data-audio="sentence4.mp3">You can click on any sentence to play its audio.</span>
    </p>

    <script>
        // Create a single audio element that we'll reuse
        const audio = new Audio();
        let currentPlaying = null;

        // Get all clickable sentences
        const sentences = document.querySelectorAll('.sentence');

        sentences.forEach(sentence => {
            sentence.addEventListener('click', function(e) {
                e.stopPropagation();
                
                const audioFile = this.getAttribute('data-audio');
                
                // Stop current audio if playing
                if (currentPlaying) {
                    currentPlaying.classList.remove('playing');
                }
                
                // If clicking the same sentence again, toggle playback
                if (audio.src.endsWith(audioFile) && !audio.paused) {
                    audio.pause();
                    this.classList.remove('playing');
                    currentPlaying = null;
                } else {
                    // Play new audio
                    audio.src = audioFile;
                    audio.play();
                    this.classList.add('playing');
                    currentPlaying = this;
                }
            });
        });

        // Remove highlight when audio finishes playing
        audio.addEventListener('ended', function() {
            if (currentPlaying) {
                currentPlaying.classList.remove('playing');
                currentPlaying = null;
            }
        });
    </script>
</body>
</html>
